name: Publish update

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: openvoice-update
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci
      # Signing downloads winCodeSign, whose archive contains macOS symlinks.
      # Windows runners cannot extract those, and this app is not code-signed.
      # signExecutable still lets electron-builder write the icon and version.
      - run: npm run dist -- "-c.win.signExecutable=false"
        env:
          OPENVOICE_COMMIT: ${{ github.sha }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - name: Publish the update feed
        shell: pwsh
        env:
          OPENVOICE_COMMIT: ${{ github.sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $stage = Join-Path $env:RUNNER_TEMP "openvoice-updater"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "dist/OpenVoice-Setup-1.0.0.exe" $stage
          $prev = ""
          try {
            $feed = Invoke-RestMethod -Headers @{
              Authorization = "Bearer $($env:GITHUB_TOKEN)"
              "User-Agent" = "OpenVoice"
              Accept = "application/vnd.github.raw"
            } -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/contents/update.json?ref=updater"
            if ($feed.commit) { $prev = [string]$feed.commit }
          } catch {
            $prev = ""
          }
          $range = @("-1")
          if ($prev) {
            git rev-parse --verify --quiet "$prev^{commit}" | Out-Null
            if ($LASTEXITCODE -eq 0) { $range = @("$prev..HEAD") }
          }
          $env:OPENVOICE_CHANGES = @(git log @range --format="%s%x1f%b%x1e") -join "`n"
          node scripts/write-update-json.mjs "$stage/OpenVoice-Setup-1.0.0.exe" $stage
          Push-Location $stage
          git init
          git checkout -b updater
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add -A
          git commit -m "Publish update"
          git push --force "https://x-access-token:${env:GITHUB_TOKEN}@github.com/${env:GITHUB_REPOSITORY}.git" HEAD:updater
          Pop-Location
